<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin User Management · MotoSheba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="adminUsersPage()" x-init="init()" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div class="text-xs font-bold uppercase tracking-wider text-amber-600">Administrator Governance</div>
        <h1 class="text-2xl font-bold text-slate-900">Platform Users & Role Access</h1>
      </div>
      <div class="flex flex-wrap gap-2 text-xs font-semibold">
        <a href="/admin-verify.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">1. Verify Queue</a>
        <a href="/admin-moderation.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">2. Listing Moderation</a>
        <a href="/admin-users.html" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white">3. Users</a>
        <a href="/admin-audit.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">4. Audit Log</a>
      </div>
    </div>

    <div x-show="message" x-text="message" class="mb-4 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 font-semibold"></div>

    <template x-if="!loading && !authorized">
      <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
        <h2 class="text-lg font-bold mb-2">Administrator Access Required</h2>
        <a href="/login.html" class="inline-block px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">Sign In as Admin</a>
      </div>
    </template>

    <template x-if="!loading && authorized">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-xs">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase">
              <th class="p-3.5">Name & Email</th>
              <th class="p-3.5">Role</th>
              <th class="p-3.5">Verified</th>
              <th class="p-3.5">Status</th>
              <th class="p-3.5">Joined</th>
              <th class="p-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            <template x-for="u in users" :key="u._id">
              <tr class="hover:bg-slate-50">
                <td class="p-3.5">
                  <div class="font-bold text-slate-900" x-text="u.name"></div>
                  <div class="text-slate-500" x-text="u.email"></div>
                </td>
                <td class="p-3.5">
                  <select @change="updateUser(u._id, { role: $event.target.value })" :value="u.role" class="px-2.5 py-1 rounded-lg border border-slate-300 bg-white font-semibold uppercase text-[11px]">
                    <option value="buyer">buyer</option>
                    <option value="seller">seller</option>
                    <option value="dealer">dealer</option>
                    <option value="garage">garage</option>
                    <option value="provider">provider</option>
                    <option value="admin">admin</option>
                  </select>
                </td>
                <td class="p-3.5">
                  <button @click="updateUser(u._id, { verified: !u.verified })" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold"
                    :class="u.verified ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'"
                    x-text="u.verified ? '✓ Verified' : 'Unverified'"></button>
                </td>
                <td class="p-3.5">
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase"
                    :class="u.status === 'active' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'"
                    x-text="u.status"></span>
                </td>
                <td class="p-3.5 text-slate-500" x-text="MotoApi.formatDate(u.createdAt)"></td>
                <td class="p-3.5 text-right">
                  <button @click="updateUser(u._id, { status: u.status === 'active' ? 'suspended' : 'active' })"
                    class="px-3 py-1 rounded-lg text-xs font-semibold border"
                    :class="u.status === 'active' ? 'border-red-300 text-red-700 hover:bg-red-50' : 'border-emerald-300 text-emerald-700 hover:bg-emerald-50'"
                    x-text="u.status === 'active' ? 'Suspend' : 'Activate'"></button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function adminUsersPage() {
      return {
        loading: true,
        authorized: false,
        users: [],
        message: '',
        async init() {
          await this.loadUsers();
        },
        async loadUsers() {
          this.loading = true;
          try {
            const res = await window.MotoApi.get('/api/admin/queue');
            this.authorized = true;
            this.users = res.users || [];
          } catch (err) {
            this.authorized = false;
          } finally {
            this.loading = false;
          }
        },
        async updateUser(userId, patch) {
          this.message = '';
          try {
            await window.MotoApi.patch('/api/admin/verify/' + userId, {
              targetType: 'user',
              ...patch
            });
            this.message = 'User account updated and audit-logged.';
            await this.loadUsers();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }
  </script>
</body>
</html>
