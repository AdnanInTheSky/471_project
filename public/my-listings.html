<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings · MotoSheba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="myListingsPage()" x-init="init()" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Manage My Vehicle Listings</h1>
        <p class="text-sm text-slate-500">Create, edit, and update availability of your listed vehicles</p>
      </div>
      <button @click="openCreateModal()" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition">
        + Create New Listing
      </button>
    </div>

    <div x-show="message" x-text="message" class="mb-4 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 font-semibold"></div>
    <div x-show="error" x-text="error" class="mb-4 p-3.5 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-semibold"></div>

    <template x-if="loading">
      <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-sm text-slate-500">Loading your listings...</div>
    </template>

    <template x-if="!loading && (!user || !['seller','dealer','admin'].includes(user.role))">
      <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
        <h2 class="text-lg font-bold text-slate-900 mb-2">Seller or Dealer Role Required</h2>
        <p class="text-xs text-slate-500 mb-4">Sign in as a Seller, Dealer, or Admin account to publish and manage vehicle listings.</p>
        <a href="/login.html" class="inline-block px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">Switch Account / Sign In</a>
      </div>
    </template>

    <template x-if="!loading && user && ['seller','dealer','admin'].includes(user.role)">
      <div>
        <template x-if="listings.length === 0">
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center">
            <h3 class="text-base font-bold mb-1">No listings created yet</h3>
            <p class="text-xs text-slate-500 mb-4">Click "+ Create New Listing" to publish your first car.</p>
          </div>
        </template>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <template x-for="car in listings" :key="car._id">
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col">
              <div class="relative h-44 bg-slate-100">
                <img :src="(car.images && car.images[0]) || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=900&q=80'" class="w-full h-full object-cover" />
                <span class="absolute top-3 left-3 px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase"
                  :class="{
                    'bg-emerald-500 text-slate-950': car.status === 'active',
                    'bg-amber-500 text-slate-950': car.status === 'reserved' || car.status === 'pending',
                    'bg-slate-700 text-white': car.status === 'sold',
                    'bg-red-600 text-white': car.status === 'rejected'
                  }"
                  x-text="car.status"></span>
              </div>
              <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                  <div class="text-xs text-slate-500 mb-1" x-text="`${car.year} · ${car.make} ${car.model} · ${(car.mileage||0).toLocaleString()} km`"></div>
                  <h3 class="text-sm font-bold text-slate-900 mb-1" x-text="car.title"></h3>
                  <div class="text-lg font-extrabold text-emerald-600 mb-3" x-text="MotoApi.formatBDT(car.price)"></div>
                </div>
                <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                  <button @click="openEditModal(car)" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800">Edit</button>
                  <select @change="quickStatus(car._id, $event.target.value)" :value="car.status" class="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs bg-white">
                    <option value="active">Active</option>
                    <option value="reserved">Reserved</option>
                    <option value="sold">Sold</option>
                  </select>
                  <a :href="'/listing.html?id=' + car._id" class="text-xs font-semibold text-emerald-600 hover:underline">View →</a>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Create / Edit Modal -->
    <div x-show="showModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
      <div class="bg-white rounded-2xl border border-slate-200 max-w-2xl w-full p-6 my-8 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
          <h2 class="text-lg font-bold text-slate-900" x-text="editingId ? 'Edit Vehicle Listing' : 'Create New Vehicle Listing'"></h2>
          <button @click="showModal = false" class="text-slate-400 hover:text-slate-700 text-lg font-bold">×</button>
        </div>

        <form @submit.prevent="saveListing()" class="space-y-4 max-h-[75vh] overflow-y-auto pr-1">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Listing Title *</label>
            <input type="text" x-model="form.title" required placeholder="e.g. 2021 Toyota Corolla Cross Z Hybrid" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Make *</label>
              <input type="text" x-model="form.make" required placeholder="Toyota" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Model *</label>
              <input type="text" x-model="form.model" required placeholder="Premio" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Year *</label>
              <input type="number" x-model="form.year" required min="1980" max="2027" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Price (BDT) *</label>
              <input type="number" x-model="form.price" required min="50000" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Condition *</label>
              <select x-model="form.condition" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white">
                <option value="reconditioned">Reconditioned</option>
                <option value="used">Used</option>
                <option value="new">New</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Mileage (km)</label>
              <input type="number" x-model="form.mileage" min="0" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Fuel Type</label>
              <input type="text" x-model="form.fuelType" placeholder="Hybrid / Octane" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Transmission</label>
              <input type="text" x-model="form.transmission" placeholder="Automatic" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Body Type</label>
              <input type="text" x-model="form.bodyType" placeholder="SUV / Sedan" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">City</label>
              <input type="text" x-model="form.location" placeholder="Dhaka" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Engine CC</label>
              <input type="number" x-model="form.engineCc" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Chassis / Frame No</label>
              <input type="text" x-model="form.chassisNo" placeholder="ZVG11-..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Exterior Color</label>
              <input type="text" x-model="form.color" placeholder="Pearl White" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Photo URL or Upload Image</label>
            <div class="flex flex-col sm:flex-row gap-2">
              <input type="text" x-model="form.images" placeholder="Comma-separated image URLs" class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs" />
              <label class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 cursor-pointer text-center">
                <span>Upload Photo File</span>
                <input type="file" accept="image/*" @change="handleFileUpload($event)" class="hidden" />
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Features (comma-separated)</label>
            <input type="text" x-model="form.features" placeholder="Sunroof, Push Start, Leather Seats, 360 Camera" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Detailed Description</label>
            <textarea x-model="form.description" rows="3" placeholder="Auction grade, maintenance history, paper status..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs"></textarea>
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button type="button" @click="showModal = false" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
              <span x-text="editingId ? 'Save Changes' : 'Publish Listing'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function myListingsPage() {
      return {
        loading: true,
        user: null,
        listings: [],
        showModal: false,
        editingId: null,
        message: '',
        error: '',
        form: {
          title: '',
          make: 'Toyota',
          model: '',
          year: 2021,
          price: 3500000,
          condition: 'reconditioned',
          mileage: 18000,
          fuelType: 'Hybrid (Octane)',
          transmission: 'Automatic',
          bodyType: 'SUV',
          location: 'Dhaka',
          engineCc: 1500,
          chassisNo: '',
          color: 'Pearl White',
          images: '',
          features: 'Push Start, Sunroof, Reverse Camera',
          description: ''
        },
        async init() {
          try {
            const auth = await window.MotoApi.get('/api/auth/me');
            this.user = auth.user;
            if (this.user && ['seller', 'dealer', 'admin'].includes(this.user.role)) {
              await this.loadMyListings();
            }
          } catch (err) {
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        },
        async loadMyListings() {
          const res = await window.MotoApi.get('/api/listings?mine=1&limit=50');
          this.listings = res.listings || [];
        },
        openCreateModal() {
          this.editingId = null;
          this.form = {
            title: '',
            make: 'Toyota',
            model: '',
            year: 2021,
            price: 3500000,
            condition: 'reconditioned',
            mileage: 18000,
            fuelType: 'Hybrid (Octane)',
            transmission: 'Automatic',
            bodyType: 'SUV',
            location: 'Dhaka',
            engineCc: 1500,
            chassisNo: '',
            color: 'Pearl White',
            images: 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=900&q=80',
            features: 'Push Start, Sunroof, Reverse Camera',
            description: ''
          };
          this.showModal = true;
        },
        openEditModal(car) {
          this.editingId = car._id;
          this.form = {
            title: car.title || '',
            make: car.make || '',
            model: car.model || '',
            year: car.year || 2020,
            price: car.price || 0,
            condition: car.condition || 'used',
            mileage: car.mileage || 0,
            fuelType: car.fuelType || 'Octane / Petrol',
            transmission: car.transmission || 'Automatic',
            bodyType: car.bodyType || 'Sedan',
            location: car.location || 'Dhaka',
            engineCc: car.engineCc || 1500,
            chassisNo: car.chassisNo || '',
            color: car.color || '',
            images: Array.isArray(car.images) ? car.images.join(', ') : '',
            features: Array.isArray(car.features) ? car.features.join(', ') : '',
            description: car.description || ''
          };
          this.showModal = true;
        },
        handleFileUpload(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === 'string') {
              this.form.images = reader.result;
            }
          };
          reader.readAsDataURL(file);
        },
        async saveListing() {
          this.message = '';
          this.error = '';
          try {
            if (this.editingId) {
              await window.MotoApi.patch('/api/listings/' + this.editingId, this.form);
              this.message = 'Listing updated successfully.';
            } else {
              await window.MotoApi.post('/api/listings', this.form);
              this.message = 'New listing published!';
            }
            this.showModal = false;
            await this.loadMyListings();
          } catch (err) {
            this.error = err.message;
          }
        },
        async quickStatus(id, status) {
          this.message = '';
          this.error = '';
          try {
            await window.MotoApi.patch('/api/listings/' + id, { status });
            this.message = `Listing status updated to ${status}.`;
            await this.loadMyListings();
          } catch (err) {
            this.error = err.message;
          }
        }
      };
    }
  </script>
</body>
</html>
