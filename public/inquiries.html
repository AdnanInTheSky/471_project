<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquiries & Messages · MotoSheba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="inquiriesPage()" x-init="init()" class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Vehicle Inquiries</h1>
      <p class="text-sm text-slate-500">Questions between buyers, private sellers, and dealer showrooms</p>
    </div>

    <template x-if="loading">
      <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">Loading inquiries...</div>
    </template>

    <template x-if="!loading && !user">
      <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
        <p class="text-sm text-slate-600 mb-4">Please sign in to view your vehicle inquiries.</p>
        <a href="/login.html" class="inline-block px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">Sign In</a>
      </div>
    </template>

    <template x-if="!loading && user">
      <div class="space-y-4">
        <template x-if="inquiries.length === 0">
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">
            No inquiries found yet. Browse listings to ask a seller a question.
          </div>
        </template>

        <template x-for="inq in inquiries" :key="inq._id">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
              <div>
                <a :href="'/listing.html?id=' + inq.listingId" class="text-base font-bold text-slate-900 hover:text-emerald-600" x-text="inq.listingTitle"></a>
                <div class="text-xs text-slate-500 mt-0.5">
                  <span>Buyer: <strong x-text="inq.buyerName"></strong></span>
                  <span> · Seller: <strong x-text="inq.sellerName"></strong></span>
                  <span> · <span x-text="MotoApi.formatDateTime(inq.createdAt)"></span></span>
                </div>
              </div>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase"
                :class="inq.status === 'replied' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                x-text="inq.status"></span>
            </div>

            <div class="mt-3 p-3.5 rounded-xl bg-slate-50 text-xs text-slate-800">
              <div class="font-bold text-slate-600 mb-1" x-text="inq.buyerName + ' asked:'"></div>
              <p x-text="inq.message"></p>
            </div>

            <div class="mt-3 space-y-2" x-show="inq.replies && inq.replies.length > 0">
              <template x-for="rep in inq.replies" :key="rep.id">
                <div class="p-3 rounded-xl bg-emerald-50/70 border border-emerald-200 text-xs">
                  <div class="flex items-center justify-between text-emerald-900 font-bold mb-1">
                    <span x-text="`${rep.authorName} (${rep.authorRole})`"></span>
                    <span class="text-[11px] font-normal text-slate-500" x-text="MotoApi.formatDateTime(rep.at)"></span>
                  </div>
                  <p class="text-slate-800" x-text="rep.message"></p>
                </div>
              </template>
            </div>

            <form @submit.prevent="sendReply(inq._id)" class="mt-4 flex gap-2">
              <input type="text" x-model="replyInputs[inq._id]" required placeholder="Write a reply..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 text-xs" />
              <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Reply</button>
            </form>
          </div>
        </template>
      </div>
    </template>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function inquiriesPage() {
      return {
        loading: true,
        user: null,
        inquiries: [],
        replyInputs: {},
        async init() {
          try {
            const auth = await window.MotoApi.get('/api/auth/me');
            this.user = auth.user;
            if (this.user) {
              await this.loadInquiries();
            }
          } catch (err) {
            console.error(err);
          } finally {
            this.loading = false;
          }
        },
        async loadInquiries() {
          const res = await window.MotoApi.get('/api/inquiries');
          this.inquiries = res.inquiries || [];
        },
        async sendReply(inquiryId) {
          const msg = this.replyInputs[inquiryId];
          if (!msg) return;
          try {
            await window.MotoApi.patch('/api/inquiries', {
              inquiryId,
              replyMessage: msg
            });
            this.replyInputs[inquiryId] = '';
            await this.loadInquiries();
          } catch (err) {
            alert(err.message);
          }
        }
      };
    }
  </script>
</body>
</html>
