<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · MotoSheba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="registerPage()" class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="max-w-lg w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Create a MotoSheba Account</h1>
      <p class="text-sm text-slate-500 mb-6">Choose your account role. Sellers and dealers can submit license details for verification.</p>

      <div x-show="error" x-text="error" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-medium"></div>

      <form @submit.prevent="submit()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
            <input type="text" x-model="form.name" required placeholder="e.g. Tariqul Islam" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Account Role *</label>
            <select x-model="form.role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="buyer">Buyer (Browse, Compare & Reserve)</option>
              <option value="seller">Private Seller (List Personal Cars)</option>
              <option value="dealer">Dealer Showroom (Storefront & Inventory)</option>
              <option value="garage">Garage Partner (Phase 2 Ready)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
            <input type="email" x-model="form.email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
            <input type="text" x-model="form.phone" placeholder="+88017..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password (min 6 characters) *</label>
          <input type="password" x-model="form.password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
        </div>

        <template x-if="['seller', 'dealer', 'garage'].includes(form.role)">
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-600">Verification Profile Details</div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" x-text="form.role === 'seller' ? 'Owner Display Name' : 'Showroom / Business Name'"></label>
              <input type="text" x-model="form.businessName" placeholder="e.g. Dhaka Auto Gallery" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm bg-white" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" x-text="form.role === 'seller' ? 'NID Number (for verification queue)' : 'Trade License / BARVIDA No.'"></label>
              <input type="text" x-model="form.licenseNo" placeholder="e.g. TRAD/DNCC/102938/2025" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm bg-white" />
            </div>
          </div>
        </template>

        <button type="submit" :disabled="submitting" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition">
          <span x-text="submitting ? 'Creating Account...' : 'Create Account'"></span>
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-slate-500">
        Already have an account? <a href="/login.html" class="font-semibold text-emerald-600 hover:underline">Sign In</a>
      </p>
    </div>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function registerPage() {
      return {
        form: {
          name: '',
          email: '',
          phone: '',
          password: '',
          role: 'buyer',
          businessName: '',
          licenseNo: ''
        },
        error: '',
        submitting: false,
        async submit() {
          this.error = '';
          this.submitting = true;
          try {
            await window.MotoApi.post('/api/auth/register', this.form);
            window.location.href = '/profile.html';
          } catch (err) {
            this.error = err.message;
          } finally {
            this.submitting = false;
          }
        }
      };
    }
  </script>
</body>
</html>
