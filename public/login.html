<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · MotoSheba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="loginPage()" class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Sign in to MotoSheba</h1>
      <p class="text-sm text-slate-500 mb-6">Access your buyer reservations, seller listings, dealer showroom, or admin console.</p>

      <div x-show="error" x-text="error" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-medium"></div>

      <form @submit.prevent="submit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" x-model="email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" x-model="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-emerald-500" />
        </div>
        <button type="submit" :disabled="submitting" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm transition">
          <span x-text="submitting ? 'Signing In...' : 'Sign In'"></span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200">
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Quick Demo Credentials (password: password123)</div>
        <div class="grid grid-cols-1 gap-2">
          <button @click="fillAndLogin('buyer@motosheba.com')" class="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-xs flex justify-between items-center">
            <span><strong>Buyer:</strong> buyer@motosheba.com</span>
            <span class="text-emerald-600 font-semibold">Use →</span>
          </button>
          <button @click="fillAndLogin('seller@motosheba.com')" class="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-xs flex justify-between items-center">
            <span><strong>Verified Seller:</strong> seller@motosheba.com</span>
            <span class="text-emerald-600 font-semibold">Use →</span>
          </button>
          <button @click="fillAndLogin('dealer@motosheba.com')" class="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-xs flex justify-between items-center">
            <span><strong>Verified Dealer:</strong> dealer@motosheba.com</span>
            <span class="text-emerald-600 font-semibold">Use →</span>
          </button>
          <button @click="fillAndLogin('ctgdealer@motosheba.com')" class="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-emerald-50 border border-slate-200 text-xs flex justify-between items-center">
            <span><strong>Pending Dealer:</strong> ctgdealer@motosheba.com</span>
            <span class="text-emerald-600 font-semibold">Use →</span>
          </button>
          <button @click="fillAndLogin('admin@motosheba.com')" class="text-left px-3 py-2 rounded-lg bg-amber-50/60 hover:bg-amber-50 border border-amber-200 text-xs flex justify-between items-center">
            <span><strong>Admin:</strong> admin@motosheba.com</span>
            <span class="text-amber-700 font-semibold">Use →</span>
          </button>
        </div>
      </div>

      <p class="mt-6 text-center text-xs text-slate-500">
        Don't have an account? <a href="/register.html" class="font-semibold text-emerald-600 hover:underline">Create an account</a>
      </p>
    </div>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function loginPage() {
      return {
        email: '',
        password: '',
        error: '',
        submitting: false,
        async submit() {
          this.error = '';
          this.submitting = true;
          try {
            const res = await window.MotoApi.post('/api/auth/login', {
              email: this.email,
              password: this.password
            });
            const role = res.user && res.user.role;
            if (role === 'admin') window.location.href = '/admin-verify.html';
            else if (role === 'dealer') window.location.href = '/inventory.html';
            else if (role === 'seller') window.location.href = '/my-listings.html';
            else window.location.href = '/listings.html';
          } catch (err) {
            this.error = err.message;
          } finally {
            this.submitting = false;
          }
        },
        fillAndLogin(email) {
          this.email = email;
          this.password = 'password123';
          this.submit();
        }
      };
    }
  </script>
</body>
</html>
