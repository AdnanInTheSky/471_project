<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Audit Log · MotoSheba Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="motosheba-navbar"></div>

  <main x-data="adminAuditPage()" x-init="init()" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <div class="text-xs font-bold uppercase tracking-wider text-amber-600">Administrator Governance</div>
        <h1 class="text-2xl font-bold text-slate-900">Immutable System Audit Trail</h1>
        <p class="text-sm text-slate-500">Every verification decision, listing moderation, and reservation milestone is recorded</p>
      </div>
      <div class="flex flex-wrap gap-2 text-xs font-semibold">
        <a href="/admin-verify.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">1. Verify Queue</a>
        <a href="/admin-moderation.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">2. Listing Moderation</a>
        <a href="/admin-users.html" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">3. Users</a>
        <a href="/admin-audit.html" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white">4. Audit Log</a>
      </div>
    </div>

    <template x-if="!loading && !authorized">
      <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
        <h2 class="text-lg font-bold mb-2">Administrator Access Required</h2>
        <a href="/login.html" class="inline-block px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">Sign In as Admin</a>
      </div>
    </template>

    <template x-if="!loading && authorized">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-xs">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase">
              <th class="p-3.5">Timestamp</th>
              <th class="p-3.5">Actor</th>
              <th class="p-3.5">Action</th>
              <th class="p-3.5">Target</th>
              <th class="p-3.5">Details</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            <template x-for="entry in logs" :key="entry._id">
              <tr class="hover:bg-slate-50">
                <td class="p-3.5 text-slate-500 whitespace-nowrap" x-text="MotoApi.formatDateTime(entry.at)"></td>
                <td class="p-3.5">
                  <div class="font-bold text-slate-900" x-text="entry.actorEmail"></div>
                  <div class="text-[10px] uppercase text-slate-500 font-bold" x-text="entry.actorRole"></div>
                </td>
                <td class="p-3.5">
                  <span class="px-2 py-0.5 rounded font-mono font-bold text-[11px] bg-slate-100 text-slate-800" x-text="entry.action"></span>
                </td>
                <td class="p-3.5 font-mono text-slate-600" x-text="`${entry.targetType || 'item'}:${entry.targetId || ''}`"></td>
                <td class="p-3.5 text-slate-800" x-text="entry.details"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </main>

  <div id="motosheba-footer"></div>

  <script>
    function adminAuditPage() {
      return {
        loading: true,
        authorized: false,
        logs: [],
        async init() {
          try {
            const res = await window.MotoApi.get('/api/admin/audit?limit=100');
            this.authorized = true;
            this.logs = res.auditLogs || [];
          } catch (err) {
            this.authorized = false;
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
